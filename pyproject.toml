# El parser de nombres y el motor de plantillas de renombrado que comparten
# DropBot y Torrent-Controller-Bot, como paquete instalable: cada bot depende
# de una versión en vez de llevar su copia, y un fallo se arregla una vez.
#
# Instala un único módulo, `name_parser`, así que `import name_parser` sigue
# funcionando igual. Sin PyPI: se instala del propio repositorio, fijado al
# commit de un tag (un tag se puede mover; un commit no):
#
#   dgongut-name-parser @ https://github.com/dgongut/name-parser/archive/<commit>.zip
#
# Una versión es un tag v<versión>, con la misma <versión> que la de abajo:
# tests/test_package.py comprueba que el módulo y este fichero digan lo mismo.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dgongut-name-parser"
version = "1.0.0"
description = "Release name parser and rename template engine shared by dgongut's bots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { file = "LICENSE" }

[project.urls]
Source = "https://github.com/dgongut/name-parser"

[tool.setuptools]
py-modules = ["name_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
